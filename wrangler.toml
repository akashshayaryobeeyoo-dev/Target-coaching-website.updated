name = "target-coaching-website-updated"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "target-photos"

# To configure D1 via wrangler.toml, obtain your D1 Database ID (UUID) from Cloudflare Dashboard:
# [[d1_databases]]
# binding = "DB"
# database_name = "target_coaching_db"
# database_id = "<YOUR_D1_DATABASE_UUID>"
