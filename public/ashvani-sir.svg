<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#bg)" />
  <circle cx="200" cy="190" r="130" fill="url(#accent)" opacity="0.2" filter="blur(20px)" />
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="10 6" opacity="0.6" />
  
  <!-- Teacher Silhouette/Portrait Structure -->
  <!-- Shoulders & Blazer -->
  <path d="M70,480 C70,360 120,330 160,320 L160,260 L240,260 L240,320 C280,330 330,360 330,480 Z" fill="url(#coat)" stroke="#334155" stroke-width="2" />
  <!-- White Formal Shirt & Tie -->
  <polygon points="180,265 220,265 210,360 190,360" fill="#ffffff" />
  <polygon points="195,268 205,268 208,350 200,365 192,350" fill="#ea580c" />
  <!-- Neck -->
  <rect x="175" y="220" width="50" height="55" rx="10" fill="url(#skin)" />
  <!-- Head & Face -->
  <ellipse cx="200" cy="170" rx="58" ry="72" fill="url(#skin)" />
  <!-- Hair (Trimmed Professional) -->
  <path d="M142,160 C140,110 165,95 200,95 C235,95 260,110 258,160 C250,125 235,115 200,115 C165,115 150,125 142,160 Z" fill="#1e1e1e" />
  <!-- Ears -->
  <ellipse cx="140" cy="170" rx="8" ry="14" fill="#fed7aa" />
  <ellipse cx="260" cy="170" rx="8" ry="14" fill="#fed7aa" />
  <!-- Spectacles / Eyeglasses -->
  <rect x="156" y="152" width="36" height="24" rx="6" fill="none" stroke="#0284c7" stroke-width="3" />
  <rect x="208" y="152" width="36" height="24" rx="6" fill="none" stroke="#0284c7" stroke-width="3" />
  <line x1="192" y1="162" x2="208" y2="162" stroke="#0284c7" stroke-width="3" />
  <!-- Eyes -->
  <ellipse cx="174" cy="164" rx="5" ry="3.5" fill="#1e293b" />
  <ellipse cx="226" cy="164" rx="5" ry="3.5" fill="#1e293b" />
  <!-- Eyebrows -->
  <path d="M158,146 Q174,142 190,146" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M210,146 Q226,142 242,146" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round" />
  <!-- Nose & Smile -->
  <path d="M198,168 L196,182 L204,182" stroke="#ea580c" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M185,198 Q200,208 215,198" stroke="#9a3412" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Badge Overlay at Bottom -->
  <rect x="30" y="415" width="340" height="50" rx="14" fill="#020617" opacity="0.9" stroke="#f97316" stroke-width="1.5" />
  <text x="200" y="438" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">ASHVANI SIR</text>
  <text x="200" y="454" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f97316" text-anchor="middle">HEAD OF CENTRE • TARGET COACHING</text>
</svg>